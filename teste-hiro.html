<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102b46">
<title>BioAR | Teste do marcador Hiro</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081b29;font-family:system-ui,sans-serif;color:#fff}
#panel{position:fixed;z-index:10;left:12px;right:12px;top:12px;padding:14px;border:1px solid #ffffff35;border-radius:16px;background:#102b46eF;box-shadow:0 8px 28px #0005}
h1{font-size:17px;margin:0 0 5px}p{font-size:12px;line-height:1.45;margin:0 0 10px;color:#d7e5ec}
#status{font-size:12px;font-weight:800;color:#7ce0ce;margin-bottom:10px}
button{width:100%;min-height:46px;border:0;border-radius:11px;background:#24a69a;color:#fff;font-weight:800;font-size:14px}
#stop{display:none;background:#a33b4b;margin-top:7px}
#aim{position:fixed;z-index:5;width:min(70vw,42vh);aspect-ratio:1;left:50%;top:58%;transform:translate(-50%,-50%);border:2px solid #5be0c8;border-radius:14px;box-shadow:0 0 0 999px #06131d25;pointer-events:none}
#aim:after{content:"MANTENHA O HIRO DENTRO DO QUADRADO";position:absolute;top:calc(100% + 9px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9px;font-weight:800;letter-spacing:.5px;background:#102b46eF;padding:7px 9px;border-radius:20px}
</style>
</head>
<body>
<div id="panel">
<h1>BioAR · Diagnóstico do Hiro</h1>
<p>Teste técnico simples, sem a interface principal. Toque para ativar e aponte para o marcador Hiro oficial, impresso ou exibido em outra tela.</p>
<div id="status">CÂMERA DESLIGADA</div>
<button id="start">Ativar teste</button>
<button id="stop">Desligar câmera</button>
</div>
<div id="aim"></div>
<script>
(()=>{
const status=document.getElementById('status'),start=document.getElementById('start'),stop=document.getElementById('stop');
let scene=null,timeout=null,found=false;
const set=t=>status.textContent=t;
function clean(){
 if(timeout){clearTimeout(timeout);timeout=null;}
 const v=document.getElementById('arjs-video');
 if(v){try{v.pause();v.srcObject?.getTracks().forEach(t=>t.stop());v.remove();}catch(e){}}
 if(scene){try{scene.pause();scene.remove();}catch(e){}scene=null;}
 document.querySelectorAll('canvas.a-canvas').forEach(c=>c.remove());
 start.disabled=false;start.style.display='block';stop.style.display='none';
}
function begin(){
 if(scene||!window.AFRAME){set('BIBLIOTECA A-FRAME NÃO CARREGOU');return;}
 found=false;start.disabled=true;start.style.display='none';stop.style.display='block';set('INICIANDO CÂMERA…');
 scene=document.createElement('a-scene');
 scene.setAttribute('embedded','');
 scene.setAttribute('vr-mode-ui','enabled: false');
 scene.setAttribute('renderer','logarithmicDepthBuffer: true; alpha: true; antialias: true');
 scene.setAttribute('arjs','trackingMethod: best; sourceType: webcam; debugUIEnabled: false; detectionMode: mono;');
 scene.innerHTML='<a-marker preset="hiro" id="hiro"><a-box position="0 0.5 0" material="color: #24a69a; roughness: 0.35"><a-animation attribute="rotation" to="0 360 0" dur="4000" repeat="indefinite"></a-animation></a-box><a-text value="HIRO OK" align="center" position="0 1.15 0" color="#ffffff" width="3"></a-text></a-marker><a-entity camera></a-entity>';
 scene.querySelector('#hiro').addEventListener('markerFound',()=>{found=true;set('SUCESSO: MARCADOR HIRO DETECTADO');});
 scene.querySelector('#hiro').addEventListener('markerLost',()=>set('CÂMERA ATIVA · MARCADOR FORA DO CAMPO'));
 scene.addEventListener('loaded',()=>set('CENA CARREGADA · PROCURANDO HIRO…'));
 window.addEventListener('camera-init',()=>set('CÂMERA AUTORIZADA · PROCURANDO HIRO…'),{once:true});
 window.addEventListener('camera-error',e=>set('ERRO DE CÂMERA: '+(e.detail?.error?.name||'verifique a permissão')),{once:true});
 window.addEventListener('arjs-video-loaded',()=>set('VÍDEO ATIVO · PROCURANDO HIRO…'),{once:true});
 document.body.appendChild(scene);
 timeout=setTimeout(()=>{if(!found)set('CÂMERA ATIVA, MAS HIRO NÃO DETECTADO · confira o marcador e a iluminação');},12000);
}
start.addEventListener('click',begin);stop.addEventListener('click',()=>{clean();set('CÂMERA DESLIGADA');});
window.addEventListener('pagehide',clean);
})();
</script>
</body>
</html>
